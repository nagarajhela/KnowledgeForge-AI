[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeforge-ai"
version = "1.0.0"
description = "Enterprise B2B Multi-Tenant AI Knowledge Base SaaS with Hybrid RAG and Citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "redis>=5.2.0,<6.0.0",
    "celery>=5.4.0,<6.0.0",
    "boto3>=1.35.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "openai>=1.55.0,<2.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "tiktoken>=0.8.0,<1.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "lxml>=5.3.0,<6.0.0",
    "chardet>=5.2.0,<6.0.0",
    "sse-starlette>=2.1.3,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
