services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgeforge}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledgeforge} -d ${POSTGRES_DB:-knowledgeforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kf-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p local/${S3_BUCKET_NAME:-knowledgeforge-documents} || true;
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kf-api
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-knowledgeforge}:${POSTGRES_PASSWORD:-knowledgeforge}@postgres:5432/${POSTGRES_DB:-knowledgeforge}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-knowledgeforge}:${POSTGRES_PASSWORD:-knowledgeforge}@postgres:5432/${POSTGRES_DB:-knowledgeforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kf-worker
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-knowledgeforge}:${POSTGRES_PASSWORD:-knowledgeforge}@postgres:5432/${POSTGRES_DB:-knowledgeforge}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-knowledgeforge}:${POSTGRES_PASSWORD:-knowledgeforge}@postgres:5432/${POSTGRES_DB:-knowledgeforge}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info -Q ingestion,maintenance --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kf-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - api
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
