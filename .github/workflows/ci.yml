name: KnowledgeForge AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff and Typecheck with Mypy
        run: |
          ruff check app
          mypy app

      - name: Run automated pytest suite
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
        run: |
          pytest -v --cov=app --cov-report=xml

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-ci
    steps:
      - uses: actions/checkout@v4

      - name: Build API & Worker Docker image
        run: docker build -t knowledgeforge-ai-backend:${{ github.sha }} ./backend
